name: Collect market observations
on:
  schedule:
    # UTC; covers both EST and EDT. Avoid the crowded top of the hour.
    - cron: '7,37 13-21 * * 1-5'
    # Overnight/next-morning retries allow official daily series to publish.
    - cron: '17 2,10 * * 1-6'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['main2.py', 'market_runtime.py', 'collect.py', 'requirements.txt', '.github/workflows/collect-market.yml']
permissions:
  contents: write
concurrency:
  group: market-data-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Initialize persistent data branch if absent
        shell: bash
        run: |
          status=0
          git ls-remote --exit-code --heads origin market-data >/dev/null || status=$?
          if [ "$status" -eq 2 ]; then
            git push origin HEAD:refs/heads/market-data
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - uses: actions/checkout@v4
        with:
          ref: market-data
          path: data_store
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and audit current observations
        id: collect
        continue-on-error: true
        env:
          SENTINEL_DATA_DIR: ${{ github.workspace }}/data_store
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_FEED: ${{ vars.ALPACA_FEED }}
          ENABLE_PAID_VOLATILITY_SOURCE: ${{ vars.ENABLE_PAID_VOLATILITY_SOURCE }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_VOL_TICKERS: ${{ vars.MASSIVE_VOL_TICKERS }}
        run: python collect.py
      - name: Persist valid observations and failure diagnostics
        if: always()
        working-directory: data_store
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in observations cache daily_history.json latest_quotes.json health.json; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: record observed market inputs and model outputs'
            git push origin HEAD:market-data
          fi
      - name: Surface incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Collection was incomplete. Valid prior days are preserved; inspect market-data/health.json.'
          exit 1
