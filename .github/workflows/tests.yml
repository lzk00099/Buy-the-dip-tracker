name: Dashboard regression tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ['**.py', 'requirements.txt', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest==9.1.1
      - run: python -m pytest -q
